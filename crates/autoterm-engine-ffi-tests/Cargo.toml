[package]
name = "autoterm-engine-ffi-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# PLAN-009 P2 (T7): 独立集成测试——经 libloading 加载 autoterm-core 的
# cdylib(autoterm_core.dll),演练 Auto 侧未来消费形态。依赖 autoterm-core
# 仅为构建顺序保证(确保 cdylib 产物先于测试生成);测试体一律走 DLL 面,
# 不直接调用 rlib 符号。libloading 0.8 已在 Cargo.lock 依赖树(ash 传递),
# 锁零新增。
[dependencies]
autoterm-core = { path = "../autoterm-core" }
libloading = "0.8"
