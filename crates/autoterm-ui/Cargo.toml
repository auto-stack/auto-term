[package]
name = "autoterm-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
autoterm-core = { version = "0.1.0", path = "../autoterm-core" }
clap = { version = "4.6.6", features = ["derive"] }
cosmic-text = "0.15"
iced = { version = "0.14.0", features = ["advanced", "tokio"] }
log = "0.4"
env_logger = { version = "0.11", optional = true }
unicode-width = "0.2.2"

[features]
# dev 取证钩子(--dev-* 参数/DevTick/转储/计数),默认关闭
dev-tools = ["dep:env_logger"]
